<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIR Check">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<title>LIR Check</title>
</head>
<body>
<div class="app-shell">
<header class="app-header">
  <div><div class="eyebrow">LOAD CONTROL</div><h1>LIR → Hoja de carga</h1></div>
  <button id="resetTop" class="icon-button" type="button" aria-label="Nuevo LIR">↻</button>
</header>

<section class="hero-card">
  <div><span class="status-dot"></span><strong>Cálculo 100 % local</strong></div>
  <p>Introduce únicamente los datos del LIR. La app calcula la HCC que debería aparecer en la hoja de carga.</p>
</section>

<section class="card">
  <div class="section-title">
    <div><span class="section-kicker">CONFIGURACIÓN</span><h2>Peso medio de bag</h2></div>
    <span class="unit">kg/bag</span>
  </div>
  <label class="large-input"><span>Peso medio</span><input id="avgBagWeight" inputmode="decimal" type="number" min="0" step="0.1" value="16.6"></label>
</section>

<main id="compartments"></main>

<button id="calculateButton" class="primary-button" type="button"><span>VER HOJA DE CARGA</span><span>→</span></button>
<button id="resetButton" class="secondary-button" type="button">Limpiar LIR</button>

<section id="resultCard" class="card results-card" hidden>
  <div class="section-title">
    <div><span class="section-kicker">RESULTADO</span><h2>Hoja de carga calculada</h2></div>
    <span id="resultBadge" class="result-badge neutral">Pendiente</span>
  </div>
  <div id="results"></div>
</section>

<footer class="app-footer"><span>LIR Check</span><span id="version">v2</span></footer>
</div>
<script src="app.js"></script>
</body>
</html>
